name: omniroute-image

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout and enrichment
        run: |
          echo "HEAD=$(git rev-parse HEAD)  branch=$(git rev-parse --abbrev-ref HEAD)"
          test -f Dockerfile
          grep -q 'gen_ai\.usage\.cost' open-sse/services/routing/otel.ts
          grep -q 'apiKeyId' open-sse/services/routing/events.ts
          grep -q 'apiKeyId' open-sse/handlers/chatCore.ts
          echo "enrichment markers OK"
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          # runner-base: lean, no browsers.
          target: runner-base
          push: true
          # Deployment nodeSelectors amd64 only — single arch is enough.
          platforms: linux/amd64
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          tags: |
            ghcr.io/kenny000666-apps/omniroute:3.8.52
            ghcr.io/kenny000666-apps/omniroute:sha-${{ github.sha }}
      - run: echo "IMAGE=ghcr.io/kenny000666-apps/omniroute:sha-${GITHUB_SHA}" > image.txt
      - uses: actions/upload-artifact@v4
        with: { name: omniroute-image, path: image.txt }
